<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KUYA</title>
  <meta name="description" content="KUYA — feed." />
  <meta name="theme-color" content="#fbfaf7" />
  
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="is-newest">
  <div class="blurBorder"></div>

  <header class="topbar">
    <div class="topbarLeft">
      
      <div class="brandRow">
        <a class="brandName" href="./">takuya</a>
        
        <nav class="inlineSocials">
          <span class="divider">/</span>
          <a href="https://www.youtube.com/@houseoftakuya" target="_blank">yt</a>
          <a href="https://instagram.com/kuya/" target="_blank">ig</a>
          <a href="https://discord.gg/EyzZ2HB" target="_blank">disc</a>
          <a href="https://tiktok.com/@kuya5k" target="_blank">tok</a>
        </nav>
      </div>

      <div class="statusRow">
        <div class="dot"></div>
        <span id="statusLead" class="brandLabel">is</span>
        <span id="statusMsg" class="statusMsg" aria-live="polite">loading...</span>
      </div>

      <nav class="categoryNav">
        <button class="catBtn active" data-tag="">newest</button>
        <button class="catBtn" data-tag="thoughts">thoughts</button>
        <button class="catBtn" data-tag="design">design</button>
        <button class="catBtn" data-tag="poly">poly</button>
        <button class="catBtn" data-tag="inspo">inspo</button>
        <button class="catBtn" id="randomBtn" title="read a random memory">random 🎲</button>
      </nav>

    </div>

    <div class="topbarRight">
      <a class="email" href="mailto:t@kuya.design">t@kuya.design</a>
      <div class="bpmLine"><span id="bpm">—</span> bpm</div>
    </div>
  </header>

<main class="wrap">

  <section class="goodreads">
    <div class="feedKicker">currently reading→</div>

    <div class="goodreadsWidget">
      <div id="gr_grid_widget_1768982139"></div>

      <script
        src="https://www.goodreads.com/review/grid_widget/60019791.currently%20reading?cover_size=small&hide_link=true&hide_title=true&num_books=20&order=a&shelf=currently-reading&sort=date_added&widget_id=1768982139"
        type="text/javascript"
        charset="utf-8">
      </script>
    </div>
  </section>

  <section class="feed">
    <div class="feedKicker">new thoughts daily at 5am→</div>
    <div id="tumblrFeed" class="tumblrFeed" aria-live="polite"></div>
  </section>

</main>

  <div id="yzyContextMenu" class="yzy-context-menu">
    <button data-action="top">back to top</button>
    <button data-action="tag" data-tag="thoughts">thoughts</button>
    <button data-action="tag" data-tag="design">design</button>
    <button data-action="tag" data-tag="poly">poly</button>
    <button data-action="tag" data-tag="inspo">inspo</button>
    <button data-action="random">random</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
